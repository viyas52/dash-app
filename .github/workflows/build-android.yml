name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-companion/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # For push/workflow_dispatch: always run.
    # For pull_request closed: only run if the PR was actually merged.
    # (API-triggered squash merges don't fire the push event, so this
    # pull_request trigger is the reliable fallback for bot-merged PRs.)
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GitHub doesn't support paths: filtering on pull_request events, so
      # we replicate it here: diff PR base vs head to see if android files changed.
      - name: Check android-companion changes (PR events only)
        id: check_android
        if: github.event_name == 'pull_request'
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- android-companion/ .github/workflows/build-android.yml)
          if [ -z "$CHANGED" ]; then
            echo "No android-companion files changed in this PR — skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Changed android files:"
            echo "$CHANGED"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.check_android.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.check_android.outputs.skip != 'true'
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: steps.check_android.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Generate a stable debug keystore on first run and commit it back to
      # the repo. From then on every build signs with the same key, so app
      # updates install over the old version without "App not installed".
      - name: Ensure stable debug keystore
        if: steps.check_android.outputs.skip != 'true'
        working-directory: android-companion/app
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Finance Companion,O=Personal,C=IN"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add debug.keystore
            git commit -m "Auto-add stable debug keystore [skip ci]"
            git push
          else
            echo "Stable debug keystore already present, using it."
          fi

      - name: Build debug APK
        if: steps.check_android.outputs.skip != 'true'
        working-directory: android-companion
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        if: steps.check_android.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: finance-companion-debug
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Publish to "android-latest" release
        if: steps.check_android.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Finance Companion — latest build
          body: |
            Latest debug APK for the Finance Companion Android app.
            Rebuilt automatically on every push to `android-companion/`.

            **Install on phone:**
            1. Download `app-debug.apk` below
            2. Tap it, allow install from unknown sources
            3. Open app, enter username + API key, enable notification access
          files: android-companion/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: 'false'
